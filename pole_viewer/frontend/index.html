<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent;
    font-family: Roboto, "Segoe UI", Arial, sans-serif; }
  #wrap { position: relative; width: 100%; border-radius: 6px; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #bar { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 5; display: flex;
    flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  .btn, select { font: 500 12px Roboto, Arial, sans-serif; height: 28px; padding: 0 10px;
    border-radius: 4px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; }
  .btn:hover, select:hover { border-color: var(--primary); }
  .btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .grp { display: flex; gap: 0; }
  .grp .btn { border-radius: 0; margin-left: -1px; }
  .grp .btn:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .grp .btn:last-child { border-radius: 0 4px 4px 0; }
  .spd { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    height: 26px; padding: 0 8px; }
  .spd input { width: 70px; }
  #tip { position: absolute; z-index: 6; pointer-events: none; display: none; max-width: 280px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font-size: 12px; line-height: 1.35;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .lbl { font-size: 11px; font-weight: 500; white-space: nowrap; padding: 1px 4px;
    border-radius: 3px; background: var(--label-bg); }
  #help { position: absolute; bottom: 6px; left: 8px; z-index: 5; font-size: 11px;
    color: var(--muted); pointer-events: none; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--text); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"></div>
  <div id="bar">
    <button class="btn" id="fit" title="Show the whole pole">Fit</button>
    <div class="grp">
      <button class="btn" data-v="iso">Iso</button>
      <button class="btn" data-v="front">Front</button>
      <button class="btn" data-v="side">Side</button>
      <button class="btn" data-v="top">Top</button>
    </div>
    <select id="focus" title="Glide to a point on the pole"></select>
    <div class="grp">
      <button class="btn" id="zin" title="Zoom in">+</button>
      <button class="btn" id="zout" title="Zoom out">−</button>
    </div>
    <label class="spd" title="Mouse-wheel zoom speed">wheel
      <input type="range" id="speed" min="0.1" max="1.5" step="0.05" value="0.5"></label>
    <button class="btn" id="lbls" title="Show / hide labels">Labels</button>
  </div>
  <div id="tip"></div>
  <div id="help">Left-drag rotate · right-drag pan · wheel zoom (to cursor) · double-click a part to focus</div>
  <div id="err"></div>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
